<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plush Intentions Login</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <img src="assets/logo.png" class="logo" alt="Plush Intentions LLC">

    <h2 class="title">Select Your Role</h2>

    <div class="role-grid">
      <button class="role-btn" data-role="admin">Admin</button>
      <button class="role-btn" data-role="technician">Technician</button>
      <button class="role-btn" data-role="fsc">Field Service Coordinator</button>
      <button class="role-btn" data-role="woc">Work Orders Coordinator</button>
    </div>

    <form id="loginForm">

      <div class="field">
        <label>Email Address</label>
        <input type="email" name="email" required>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>

      <button type="submit" class="login-btn">Continue</button>

      <p id="loginError" class="error"></p>

    </form>

  </div>

</div>

<script src="supabase.js"></script>
<script src="login.js"></script>

</body>
</html>
