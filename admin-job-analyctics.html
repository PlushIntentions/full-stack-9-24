<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Analytics Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Job Analytics Dashboard</h1>
</header>

<main class="profile-container">

  <h2 class="section-title">Filters</h2>
  <div class="client-card" id="filterBox">

    <div class="profile-field">
      <label>Status</label>
      <select id="filterStatus">
        <option value="">All</option>
        <option value="open">Open</option>
        <option value="assigned">Assigned</option>
        <option value="in_progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <div class="profile-field">
      <label>Technician</label>
      <select id="filterTech">
        <option value="">All Technicians</option>
      </select>
    </div>

    <div class="profile-field">
      <label>Date Start</label>
      <input type="date" id="filterStart">
    </div>

    <div class="profile-field">
      <label>Date End</label>
      <input type="date" id="filterEnd">
    </div>

    <button class="edit-btn" id="applyFilters">Apply Filters</button>
  </div>

  <h2 class="section-title">Summary</h2>
  <div id="summaryCard" class="client-card"></div>

  <h2 class="section-title">Job Volume by Month</h2>
  <div id="monthList"></div>

  <h2 class="section-title">Completion Rates</h2>
  <div id="completionList"></div>

  <h2 class="section-title">Technician Performance</h2>
  <div id="techList"></div>

  <button class="edit-btn" id="exportCSV">Export CSV</button>

</main>

<script src="supabase.js"></script>
<script src="admin-job-analytics.js"></script>

</body>
</html>
