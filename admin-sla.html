<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job SLA Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Job SLA Monitor</h1>
</header>

<main class="profile-container">

  <h2 class="section-title">Filters</h2>
  <div class="client-card" id="filterBox">

    <div class="profile-field">
      <label>Status</label>
      <select id="filterStatus">
        <option value="">All</option>
        <option value="scheduled">Scheduled</option>
        <option value="assigned">Assigned</option>
        <option value="in_progress">In Progress</option>
      </select>
    </div>

    <div class="profile-field">
      <label>Date Start</label>
      <input type="date" id="filterStart">
    </div>

    <div class="profile-field">
      <label>Date End</label>
      <input type="date" id="filterEnd">
    </div>

    <button class="edit-btn" id="applyFilters">Apply Filters</button>
  </div>

  <h2 class="section-title">SLA Alerts</h2>
  <div id="slaList"></div>

</main>

<script src="supabase.js"></script>
<script src="admin-sla.js"></script>

</body>
</html>
