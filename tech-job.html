<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Job Details</h1>
</header>

<main class="profile-container">

  <div id="jobCard" class="client-card"></div>

  <h2 class="section-title">Client Info</h2>
  <div id="clientCard" class="client-card"></div>

  <h2 class="section-title">Actions</h2>
  <button class="view-btn" id="checkInBtn">Check In</button>
  <button class="view-btn" id="checkOutBtn">Check Out</button>
  <button class="view-btn" id="completeBtn">Mark Complete</button>

  <h2 class="section-title">Upload Photos</h2>
  <form id="photoForm" class="client-card">
    <div class="profile-field">
      <label>Photo Type</label>
      <select name="type">
        <option value="before">Before</option>
        <option value="after">After</option>
      </select>
    </div>

    <div class="profile-field">
      <label>Select Photo</label>
      <input type="file" name="file" required>
    </div>

    <button class="edit-btn" type="submit">Upload Photo</button>
    <p id="photoMessage"></p>
  </form>

  <h2 class="section-title">Job Notes</h2>
  <form id="noteForm" class="client-card">
    <textarea name="note" placeholder="Add job notes..." required></textarea>
    <button class="edit-btn" type="submit">Save Note</button>
    <p id="noteMessage"></p>
  </form>

  <h2 class="section-title">Messages</h2>
  <div id="msgList"></div>

  <form id="msgForm" class="client-card">
    <textarea name="content" placeholder="Send a message..." required></textarea>
    <button class="edit-btn" type="submit">Send Message</button>
    <p id="msgMessage"></p>
  </form>

</main>

<script src="supabase.js"></script>
<script src="tech-job.js"></script>

</body>
</html>
