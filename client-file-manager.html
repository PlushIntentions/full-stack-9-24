<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1>File Manager</h1>
  </header>

  <main class="profile-container">

    <form id="uploadForm" class="client-card">

      <div class="profile-field">
        <label>File Name</label>
        <input name="doc_name" placeholder="e.g., Lease Agreement" required>
      </div>

      <div class="profile-field">
        <label>Select File</label>
        <input name="file" type="file" required>
      </div>

      <button class="edit-btn" type="submit">Upload File</button>

      <p id="uploadMessage" style="margin-top:10px;"></p>
    </form>

    <h2 class="section-title">Your Files</h2>
    <div id="fileList"></div>

  </main>

  <script src="supabase.js"></script>
  <script src="client-file-manager.js"></script>

</body>
</html>
