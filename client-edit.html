<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Client</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <h1>Edit Client</h1>
  </header>

  <main class="profile-container">

    <form id="editForm" class="client-card">

      <div class="profile-field">
        <label>full_name</label>
        <input name="full_name">
      </div>

      <div class="profile-field">
        <label>email</label>
        <input name="email">
      </div>

      <div class="profile-field">
        <label>phone</label>
        <input name="phone">
      </div>

      <div class="profile-field">
        <label>address</label>
        <input name="address">
      </div>

      <div class="profile-field">
        <label>lat</label>
        <input name="lat" type="number" step="0.000001">
      </div>

      <div class="profile-field">
        <label>lng</label>
        <input name="lng" type="number" step="0.000001">
      </div>

      <div class="profile-field">
        <label>status</label>
        <input name="status">
      </div>

      <div class="profile-field">
        <label>preferred_contact</label>
        <input name="preferred_contact">
      </div>

      <div class="profile-field">
        <label>notes</label>
        <textarea name="notes"></textarea>
      </div>

      <button class="edit-btn" type="submit">Update Client</button>

      <button class="view-btn" type="button" onclick="viewDocuments()">View Documents</button>
      <button class="view-btn" type="button" onclick="viewJobs()">View Jobs</button>

    </form>

  </main>

  <script src="supabase.js"></script>
  <script src="client-edit.js"></script>
</body>
</html>
