<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Location</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <h1>Client Location</h1>
  </header>

  <main class="profile-container">

    <div id="locationCard" class="client-card">
      <div class="client-field">
        <label>Address</label>
        <span id="clientAddress"></span>
      </div>

      <div class="client-field">
        <label>Coordinates</label>
        <span id="clientCoords"></span>
      </div>

      <button class="view-btn" id="navigateBtn">Open in Google Maps</button>
    </div>

    <div id="map" class="map-box"></div>

  </main>

  <script src="supabase.js"></script>
  <script src="client-map.js"></script>
</body>
</html>
